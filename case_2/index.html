
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Счётчик</title>
  <!-- Подключаем CSS-файл -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="result">0</div>

  <div class="buttons">
    <button class="btn" id="minus">−</button>
    <button class="btn" id="plus">+</button>
  </div>

  <div id="warning"></div>

  <!-- Подключаем JS-файл, defer гарантирует,
       что скрипт выполнится после загрузки разметки -->
  <script src="script.js" defer></script>
</body>
</html>
