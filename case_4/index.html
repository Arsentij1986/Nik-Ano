<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Калькулятор на 4 операции</title>
  <!-- Подключаем CSS-файл -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculator">
    <h1>Калькулятор</h1>

    <div class="inputs">
      <input type="text" id="num1" placeholder="Число 1">
      <input type="text" id="num2" placeholder="Число 2">
    </div>

    <div class="buttons">
      <button data-op="sum">Сумма</button>
      <button data-op="diff">Разность</button>
      <button data-op="mul">Произведение</button>
      <button data-op="div">Деление</button>
    </div>

    <div id="result"></div>
  </div>

  <!-- Подключаем JS-файл, defer гарантирует,
       что скрипт выполнится после загрузки разметки -->
  <script src="script.js" defer></script>
</body>
</html>
